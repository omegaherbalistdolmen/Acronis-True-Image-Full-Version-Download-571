<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0a1628"/>
<stop offset="55%" stop-color="#0e2438"/>
<stop offset="100%" stop-color="#0a1a2e"/>
</linearGradient>
<radialGradient id="glow1" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#38bdf8"/>
<stop offset="100%" stop-color="#0369a1"/>
</linearGradient>
<linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#67e8f9"/>
<stop offset="100%" stop-color="#0ea5e9"/>
</linearGradient>
<linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="100%" stop-color="#3b82f6"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
<circle cx="950" cy="120" r="260" fill="url(#glow1)"/>

<!-- grid lines -->
<g stroke="#1e3a52" stroke-width="1" opacity="0.5">
<line x1="0" y1="60" x2="1200" y2="60"/>
<line x1="0" y1="120" x2="1200" y2="120"/>
<line x1="0" y1="180" x2="1200" y2="180"/>
<line x1="0" y1="240" x2="1200" y2="240"/>
<line x1="0" y1="300" x2="1200" y2="300"/>
<line x1="200" y1="0" x2="200" y2="360"/>
<line x1="400" y1="0" x2="400" y2="360"/>
<line x1="600" y1="0" x2="600" y2="360"/>
<line x1="800" y1="0" x2="800" y2="360"/>
<line x1="1000" y1="0" x2="1000" y2="360"/>
</g>

<!-- data flow lines converging into shield -->
<g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.55">
<path d="M760 60 Q 880 100 940 170"/>
<path d="M780 300 Q 890 250 940 190"/>
<path d="M700 40 Q 850 90 935 155"/>
<path d="M720 320 Q 860 270 935 205"/>
</g>

<!-- disk platters stacked, right side, being protected -->
<g transform="translate(960,180)">
<ellipse cx="0" cy="60" rx="120" ry="34" fill="#082f49" opacity="0.6"/>
<ellipse cx="0" cy="30" rx="120" ry="34" fill="#0c4a6e" opacity="0.75"/>
<ellipse cx="0" cy="0" rx="120" ry="34" fill="url(#diskGrad)"/>
<circle cx="0" cy="0" r="14" fill="#0a1628"/>
<ellipse cx="0" cy="0" rx="120" ry="34" fill="none" stroke="#e0f7ff" stroke-width="1.5" opacity="0.6"/>
</g>

<!-- shield overlay guarding the disk -->
<g transform="translate(1015,150)">
<path d="M0 -55 L48 -35 L48 15 C48 55 24 78 0 92 C-24 78 -48 55 -48 15 L-48 -35 Z" fill="url(#shieldGrad)" opacity="0.92" stroke="#bae6fd" stroke-width="2"/>
<path d="M-22 8 L-6 26 L26 -18" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- decorative binary particles -->
<g fill="#38bdf8" opacity="0.35" font-family="'Segoe UI', Arial, sans-serif" font-size="14">
<text x="70" y="300">01001</text>
<text x="130" y="60">1010</text>
<text x="1080" y="60">0110</text>
<text x="1090" y="310">1001</text>
</g>

<!-- accent progress bar motif -->
<rect x="64" y="264" width="360" height="10" rx="5" fill="#0e2c44"/>
<rect x="64" y="264" width="240" height="10" rx="5" fill="url(#barGrad)"/>
<circle cx="304" cy="269" r="9" fill="#e0f7ff"/>

<!-- headline -->
<text x="60" y="140" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="52" fill="#f0f9ff">
<tspan x="60" y="140" textLength="1000" lengthAdjust="spacingAndGlyphs">Acronis True Image Full</tspan>
<tspan x="60" y="205" textLength="640" lengthAdjust="spacingAndGlyphs">Version Download</tspan>
</text>

<!-- tagline -->
<text x="60" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#93c5fd" textLength="900" lengthAdjust="spacingAndGlyphs">
Download and activate the full version of Acronis True Image
</text>
<text x="60" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#93c5fd" textLength="620" lengthAdjust="spacingAndGlyphs">
for complete disk backup and recovery.
</text>
</svg>